# Manual trigger: build binaries for all platforms in one run.
# Reuses the upstream _build.yml reusable workflow verbatim (inherited by the
# fork); zero customization, zero secrets.
name: Build All Platforms

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # required: must grant what _build.yml (callee) declares
  attestations: write  # GitHub Actions requires callee perms to be a caller subset

jobs:
  build:
    name: Build all platforms
    uses: ./.github/workflows/_build.yml